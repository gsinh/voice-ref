# Local stack. Mirrors production: one backend process (the HF Space), Postgres (Neon in
# production) and the Next.js BFF (Cloudflare Workers in production). Optional services
# join later behind profiles (workflows, voice), only when a phase needs them (YAGNI).
#
# Every setting comes from .env (12-factor). Host ports bind to 127.0.0.1 only.

x-backend: &backend
  image: ${IMAGE_PREFIX:-voiceref}/backend:${IMAGE_TAG:-dev}
  build:
    context: backend
    args:
      WITH_LAYA: ${WITH_LAYA:-true}
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-local}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    BANK_DATABASE_URL: postgresql://bank_api:${BANK_DB_PASSWORD}@postgres:5432/voiceref
    ORCHESTRATOR_DATABASE_URL: postgresql://orchestrator:${ORCHESTRATOR_DB_PASSWORD}@postgres:5432/voiceref
    TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:?set TOKEN_SIGNING_KEY in .env}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    SIDECARS: ${SIDECARS-laya}   # no colon: an explicitly empty value means "none"
    SYSTEM1_ENABLED: ${SYSTEM1_ENABLED:-true}
    SYSTEM1_URL: ${SYSTEM1_URL:-http://127.0.0.1:8100}
    SYSTEM1_API_KEY: ${SYSTEM1_API_KEY:-}
    DEMO_OTP: ${DEMO_OTP:-123456}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voiceref
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BANK_DB_PASSWORD: ${BANK_DB_PASSWORD:?set BANK_DB_PASSWORD in .env}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?set ORCHESTRATOR_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/bootstrap.sql:/bootstrap/bootstrap.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voiceref"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off admin process (12-factor, XII): migrate, then reset the demo data.
  migrate:
    <<: *backend
    command: ["migrate", "seed"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    <<: *backend
    restart: unless-stopped
    stop_grace_period: 15s
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-7860}:7860"]
    volumes:
      - hfcache:/data/hf   # Laya weights survive restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: ${IMAGE_PREFIX:-voiceref}/web:${IMAGE_TAG:-dev}
    build: { context: web }
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:7860
      # BACKEND_TOKEN is only needed for the private HF Space in production.
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  hfcache:
