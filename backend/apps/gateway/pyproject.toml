[project]
name = "gateway"
version = "0.1.0"
description = "Composition root: mounts the modules into one FastAPI process, plus migrate/seed commands."
requires-python = ">=3.12,<3.13"
dependencies = [
    "config-kit",
    "fastapi>=0.116",
    "pydantic-settings>=2.10",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.35",
    "banking-api",
    "mcp-server",
    "orchestrator",
]

[tool.uv.sources]
config-kit = { workspace = true }
banking-api = { workspace = true }
mcp-server = { workspace = true }
orchestrator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
