[project]
name = "voice-worker"
version = "0.1.0"
description = "LiveKit voice agent: audio in and out, with the orchestrator's graph doing the thinking."
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents>=1.8,<2",
    "livekit-plugins-silero>=1.8,<2",
    "livekit-plugins-openai>=1.8,<2",
    "kokoro-onnx>=0.6",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_worker"]
