[project]
name = "config-kit"
version = "0.1.0"
description = "Shared settings convention: environment variables, plus secret files when present."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic-settings>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_kit"]
