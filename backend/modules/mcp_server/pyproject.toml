[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server: the only way the LLM reaches bank data (ADR-0006)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116",
    "pydantic-settings>=2.10",
    "mcp>=1.24,<2",
    "httpx>=0.28",
    "signed-tokens",
]

[tool.uv.sources]
signed-tokens = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
