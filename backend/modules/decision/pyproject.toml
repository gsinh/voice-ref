[project]
name = "decision"
version = "0.1.0"
description = "System-1 decisions with the Laya model (ADR-0005)."
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.116", "pydantic-settings>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision"]
