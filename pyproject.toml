# uv workspace root. Each service and lib is a member with its own pyproject.toml.
# Shared tooling config (ruff, mypy, pytest) lives here so every member is checked the same way.
[project]
name = "voice-ref"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/orchestrator", "services/banking_api", "services/mcp_server", "services/decision"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "N", "RUF"]
ignore = ["S104"]  # binding to 0.0.0.0 is intended inside containers

[tool.ruff.lint.isort]
known-first-party = ["voiceref_common", "orchestrator", "banking_api", "mcp_server", "decision"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["libs/common/src", "services/orchestrator/src", "services/banking_api/src", "services/mcp_server/src", "services/decision/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
