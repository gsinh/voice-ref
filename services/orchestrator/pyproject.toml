[project]
name = "orchestrator"
version = "0.1.0"
description = "Conversation orchestrator: LangGraph graph exposed over HTTP for text and voice."
requires-python = ">=3.12,<3.13"
dependencies = ["voiceref-common"]

[tool.uv.sources]
voiceref-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
