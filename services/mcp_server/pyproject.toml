[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing banking tools to the agent. The only way the LLM reaches bank data (ADR-0006)."
requires-python = ">=3.12,<3.13"
dependencies = ["voiceref-common"]

[tool.uv.sources]
voiceref-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
