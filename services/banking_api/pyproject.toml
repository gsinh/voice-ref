[project]
name = "banking-api"
version = "0.1.0"
description = "Mock bank system of record: customers, accounts, cards, transactions."
requires-python = ">=3.12,<3.13"
dependencies = ["voiceref-common"]

[tool.uv.sources]
voiceref-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_api"]
