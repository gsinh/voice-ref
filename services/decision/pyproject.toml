[project]
name = "decision"
version = "0.1.0"
description = "System-1 decision service wrapping the Laya model (ADR-0005)."
requires-python = ">=3.12,<3.13"
dependencies = ["voiceref-common"]

[tool.uv.sources]
voiceref-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision"]
