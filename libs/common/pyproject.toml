[project]
name = "voiceref-common"
version = "0.1.0"
description = "Tiny shared infrastructure helpers: settings base, JSON logging, health endpoints. No domain code."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116",
    "pydantic-settings>=2.10",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceref_common"]
