name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voiceref
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Integration and end-to-end tests run against real Postgres (with the same
      # bootstrap, roles and migrations as production).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voiceref
      TEST_BANK_DATABASE_URL: postgresql://bank_api:bank@localhost:5432/voiceref
      TEST_ORCHESTRATOR_DATABASE_URL: postgresql://orchestrator:orch@localhost:5432/voiceref
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --all-packages --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Module boundaries
        run: uv run lint-imports
      - name: Typecheck
        run: uv run mypy apps libs modules
      - name: Bootstrap database (roles and schemas)
        run: >-
          psql "$TEST_DATABASE_URL" -v bank_pw=bank -v orch_pw=orch
          -f ../infra/postgres/bootstrap.sql
      - name: Migrate
        run: uv run python -m gateway migrate
        env:
          BANK_DATABASE_URL: ${{ env.TEST_BANK_DATABASE_URL }}
          ORCHESTRATOR_DATABASE_URL: ${{ env.TEST_ORCHESTRATOR_DATABASE_URL }}
          TOKEN_SIGNING_KEY: ci-only-signing-key-not-a-secret-0123456789
      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
